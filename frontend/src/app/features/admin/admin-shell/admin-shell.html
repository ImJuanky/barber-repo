<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><mat-icon>content_cut</mat-icon></span>
      <span class="brand-name">Peluquería</span>
    </div>

    <span class="spacer"></span>

    <div class="account-chip">
      <span class="account-avatar">{{ initials() }}</span>
      <span class="account-name">{{ displayName() }}</span>
    </div>
    <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión" matTooltip="Cerrar sesión">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <div class="shell-body">
    <nav class="sidenav" aria-label="Navegación de administración">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <main class="shell-content">
      <router-outlet />
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navegación de administración">
    @for (item of navItems; track item.path) {
      <a class="bottom-nav-item" [routerLink]="item.path" routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.shortLabel }}</span>
      </a>
    }
  </nav>
</div>
