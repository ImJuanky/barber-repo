<mat-toolbar color="primary" class="admin-toolbar">
  <mat-icon>content_cut</mat-icon>
  <span class="toolbar-title">Peluquería &middot; Panel</span>
  <span class="spacer"></span>
  <span class="admin-name">{{ auth.currentAdmin()?.name }}</span>
  <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="admin-container">
  <mat-sidenav mode="side" opened class="admin-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/admin/reservas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event_available</mat-icon>
        <span matListItemTitle>Reservas</span>
      </a>
      <a mat-list-item routerLink="/admin/huecos" routerLinkActive="active-link">
        <mat-icon matListItemIcon>schedule</mat-icon>
        <span matListItemTitle>Huecos</span>
      </a>
      <a mat-list-item routerLink="/admin/calendario" routerLinkActive="active-link">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Calendario</span>
      </a>
      <a mat-list-item routerLink="/admin/estadisticas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Estadísticas</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
